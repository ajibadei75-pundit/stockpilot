<body>
<button class="tbtn fixed" data-a="theme" aria-label="Switch day and night mode"><span class="sun"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span><span class="moon"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button><div id="root"></div><div id="toast" class="toast" hidden role="status"></div><dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const SB_URL='https://twjqkymbwqxdzxxmjqej.supabase.co',SB_KEY='sb_publishable_M0qsDlfCILgjZw_cVJ1zMg_TtpW8RGK'; // publishable key: safe in the browser, protected by row-level security
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=t=>new Date(t).toLocaleString('en-NG',{timeZone:'Africa/Lagos',dateStyle:'medium',timeStyle:'short'});
const base=()=>location.origin+location.pathname;
let st={user:null,profile:null,mem:[],cur:null,tab:'',cart:[],key:crypto.randomUUID(),prod:[],q:'',disc:0,pm:'cash',recovery:false};
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};
const db=async p=>{const{data,error}=await p;if(error){toast(error.message);throw error}return data};
const busy=async(b,f)=>{if(b)b.disabled=true;try{await f()}catch(e){}finally{if(b)b.disabled=false}};
const lagosDay=(off=0)=>{const n=new Date(Date.now()+3600e3);return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+off)-3600e3).toISOString()};
const role=()=>st.profile?.is_platform_admin&&!st.cur?'platform':st.cur?.role;
const shop=()=>st.cur?.shops;
/* ---------- boot ---------- */
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){st.recovery=true;return authView()}
 if(ev==='SIGNED_OUT'){st={...st,user:null,profile:null,mem:[],cur:null};return authView()}
 if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION')&&s&&s.user.id!==st.user?.id){st.user=s.user;setTimeout(load,0)}
 if(ev==='INITIAL_SESSION'&&!s)route()});
addEventListener('hashchange',route);
async function route(){const h=location.hash;if(h.startsWith('#verify='))return verifyView(h.slice(8));
 if(h.startsWith('#invite=')){sessionStorage.setItem('inv',h.slice(8));history.replaceState(null,'',base())}
 st.user?load():authView()}
/* ---------- public receipt check ---------- */
async function verifyView(tok){$('#root').innerHTML='<div class="auth"><div class="card"><h2 style="margin:0">Receipt check</h2><div id="v">Checking…</div><a href="'+base()+'">Open StockPilot</a></div></div>';
 const{data,error}=await sb.rpc('verify_receipt',{p_token:tok});const d=data;
 $('#v').innerHTML=error||!d?'<b class="rejected">Not found.</b> This receipt does not exist.':`<b class="confirmed">Valid receipt</b><br>${esc(d.shop)}<br>${esc(d.receipt_no)} · ${dt(d.date)}<br>Total ${fmt(d.total)}<br>Sale: ${esc(d.status)} · Payment: ${esc(d.payment)}`}
/* ---------- auth ---------- */
async function inviteView(tok){$('#root').innerHTML='<div class="auth"><div class="card"><div class="logo">'+ic('box')+'</div><p class="hint" style="text-align:center;margin:0">Checking your invitation...</p></div></div>';
 const{data:info}=await sb.rpc('invite_info',{p_token:tok});
 if(!info){sessionStorage.removeItem('inv');$('#root').innerHTML='<div class="auth"><div class="card"><div class="logo">'+ic('box')+'</div><h2 style="margin:0;text-align:center">Invitation not valid</h2><p class="hint" style="margin:0;text-align:center">This link has expired, was already used, or was cancelled. Ask the person who invited you to send a new link.</p><button class="btn" id="bk">Go to sign in</button></div></div>';$('#bk').onclick=()=>authView('in',true);return}
 const rl={owner:'the owner',cashier:'a cashier',viewer:'a viewer'}[info.role];
 $('#root').innerHTML=`<div class="auth"><div class="card"><div class="logo">${ic('box')}</div><h2 style="margin:0;text-align:center">Welcome to StockPilot</h2><p class="hint" style="margin:0;text-align:center">You were invited to join <b>#${info.shop_no} · ${esc(info.shop)}</b> as ${rl}. Create your account below. You will open your shop straight away.</p>
 <label>Your full name<input id="fn" autocomplete="name"></label><label>Your email<input id="em" type="email" autocomplete="email"></label><label>Choose a password (8 or more characters)<input id="pw" type="password" autocomplete="new-password" minlength="8"></label>
 <button class="btn" id="go">Create my account and open my shop</button><button class="link" id="ex">I already have an account</button></div></div>`;
 $('#ex').onclick=()=>authView('in',true);
 $('#go').onclick=e=>busy(e.target,async()=>{const email=val('em'),password=$('#pw').value,full_name=val('fn');
  if(!full_name||!email||password.length<8)return toast('Fill in your name, email and a password of at least 8 characters');
  let r,j={};try{r=await fetch(SB_URL+'/functions/v1/accept-invite-signup',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({token:tok,email,password,full_name})});j=await r.json()}catch(x){return toast('No connection. Check your data and try again.')}
  if(!r.ok){toast(j.error||'Could not create your account');if(j.exists)authView('in',true);return}
  const{error}=await sb.auth.signInWithPassword({email,password});if(error)toast(error.message)})}
function authView(mode='in',skipInvite){document.body.classList.remove('in');if(!skipInvite&&!st.recovery&&sessionStorage.getItem('inv'))return inviteView(sessionStorage.getItem('inv'));const inv=sessionStorage.getItem('inv');
 if(st.recovery){$('#root').innerHTML='<div class="auth"><div class="card"><h2 style="margin:0">Set a new password</h2><input id="np" type="password" minlength="8" placeholder="New password (8+ characters)"><button class="btn" id="sp">Save password</button></div></div>';
  return $('#sp').onclick=e=>busy(e.target,async()=>{const{error}=await sb.auth.updateUser({password:$('#np').value});if(error){toast(error.message);return}st.recovery=false;toast('Password updated');load()})}
 $('#root').innerHTML=`<div class="auth"><div class="card"><div class="logo">${ic('box')}</div><h2 style="margin:0;text-align:center">StockPilot</h2><p class="hint" style="text-align:center;margin:0">Sign in to sell, count your stock and see your money.</p>${inv?'<div class="note"><span>Sign in with your existing account to join the shop.</span></div>':''}
 ${mode=='up'?'<label>Full name<input id="fn" autocomplete="name"></label>':''}<label>Email<input id="em" type="email" autocomplete="email"></label>
 ${mode=='reset'?'':'<label>Password<input id="pw" type="password" autocomplete="'+(mode=='up'?'new':'current')+'-password" minlength="8"></label>'}
 <button class="btn" id="go">${{in:'Sign in',up:'Create account',reset:'Email me a reset link'}[mode]}</button>
 <div>${mode!='in'?'<button class="link" data-m="in">Sign in</button>':''}${mode!='up'?'':''}${mode!='reset'?'<button class="link" data-m="reset">Forgot password?</button>':''}</div></div></div>`;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>authView(b.dataset.m));
 $('#go').onclick=e=>busy(e.target,async()=>{const email=$('#em').value.trim(),password=($('#pw')||{}).value;
  if(mode=='reset'){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:base()});return toast(error?error.message:'Check your email for the reset link')}
  if(mode=='up'){const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:$('#fn').value.trim()},emailRedirectTo:base()}});if(error)return toast(error.message);if(!data.session)return toast('Account created. Confirm your email, then sign in.')}
  else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)toast(error.message)}})}
/* ---------- load context ---------- */
async function load(){const u=st.user;if(!u)return authView();
 st.profile=await db(sb.from('profiles').select('*').eq('id',u.id).single());
 const inv=sessionStorage.getItem('inv');
 if(inv){sessionStorage.removeItem('inv');const{error}=await sb.rpc('accept_invitation',{p_token:inv});toast(error?error.message:'Invitation accepted. Welcome aboard.')}
 st.mem=(await db(sb.from('shop_members').select('*,shops(*)').eq('user_id',u.id).eq('active',true))).filter(m=>m.shops);

async function rangeSales(){const f=val('f'),t=val('t');if(!f||!t||f>t)throw(toast('Choose a valid date range'),new Error('range'));
 const a=new Date(f+'T00:00:00+01:00').toISOString(),z=new Date(new Date(t+'T00:00:00+01:00').getTime()+864e5).toISOString();
 return db(sb.from('sales').select('*,payments(*)').eq('shop_id',st.cur.shop_id).gte('created_at',a).lt('created_at',z).order('created_at'))}

/* ---------- offline queue, backup, install, updates ---------- */
const QK='sp:q',qGet=()=>{try{return JSON.parse(localStorage.getItem(QK))||[]}catch(e){return[]}};
const qSet=a=>{try{localStorage.setItem(QK,JSON.stringify(a));return true}catch(e){toast('This device is out of storage. Reconnect to sync, or download a backup.');return false}};
const qMine=()=>qGet().filter(x=>x.user===st.user?.id),qAdd=x=>qSet([...qGet(),x]);
function clearCaches(){Object.keys(localStorage).filter(k=>k.startsWith('sp:v:')||k.startsWith('sp:prod:')).forEach(k=>localStorage.removeItem(k))}
function qBadge(){const e=$('#qp');if(!e)return;const q=qMine(),f=q.filter(x=>x.fail).length,w=q.length-f;e.hidden=!q.length;e.textContent=(w?w+' waiting to sync':'')+(w&&f?' · ':'')+(f?f+' need attention':'')}
let syncing=false;
async function syncQueue(){if(syncing||!navigator.onLine||!st.user)return;syncing=true;let done=0;
 try{for(const it of qMine()){if(it.fail)continue;const{error}=await sb.rpc('checkout',it.p);
  if(error&&!error.code)break;
  if(error){qSet(qGet().map(x=>{if(x.id==it.id)x.fail=error.message;return x}));continue}
  qSet(qGet().filter(x=>x.id!==it.id));done++}}finally{syncing=false}
 qBadge();badge();if(done){toast(done+' saved sale'+(done>1?'s':'')+' synced to the server');if(st.cur){if(st.tab=='pos'){await posData();drawQueue()}else views[st.tab]&&views[st.tab]()}}}
function drawQueue(){const b=$('#qbox');if(!b)return;const q=qMine().filter(x=>x.shop===st.cur.shop_id);
 b.innerHTML=q.length?`<h2>Saved on this device (${q.length})</h2>`+q.map(x=>`<div class="note" ${x.fail?'style="border-color:var(--er)"':''}><span>${dt(x.at)} · about ${fmt(x.est)} · ${esc(x.p.p_method)}<br><small>${x.fail?'Not accepted by the server: '+esc(x.fail):'Waiting to sync. Not yet recorded on the server; payment is not confirmed.'}</small></span><span>${x.fail?`<button class="btn sm sec" data-a="qre" data-id="${x.id}">Retry</button> `:''}<button class="btn sm bad" data-a="qdel" data-id="${x.id}">Discard</button></span></div>`).join('')+'<button class="btn sec sm" data-a="qexp">Download these as JSON</button>':''}
const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function fetchAll(tb,pk,fl){let out=[],from=0;for(;;){const{data,error}=await fl(sb.from(tb).select('*')).order(pk).range(from,from+999);if(error){toast(error.message);throw error}out=out.concat(data);if(data.length<1000)return out;from+=1000}}
act.backup=(d,b)=>busy(b,async()=>{if(!navigator.onLine)return toast('Go online to download a full backup');const id=st.cur.shop_id,f=q=>q.eq('shop_id',id);toast('Preparing backup…');
 const T={};for(const[k,pk]of[['categories','id'],['products','id'],['product_prices','id'],['stock_movements','id'],['sales','id'],['sale_items','id'],['sale_item_costs','sale_item_id'],['payments','id'],['notifications','id'],['audit_logs','id'],['report_logs','id']])T[k]=await fetchAll(k,pk,f);
 T.shop=shop();const raw=JSON.stringify(T),n=new Date().toISOString();
 const out={format:'stockpilot-backup',version:1,shop_id:id,shop_name:shop().name,exported_at:n,exported_by:st.user.email,counts:Object.fromEntries(Object.entries(T).map(([k,v])=>[k,Array.isArray(v)?v.length:1])),sha256:await sha(raw),device_pending_sales:qMine().filter(x=>x.shop===id),data:T};
 await db(sb.rpc('log_report',{p_shop:id,p_type:'backup',p_from:n.slice(0,10),p_to:n.slice(0,10),p_format:'json'}));
 dl('stockpilot-backup-'+shop().name.replace(/\W+/g,'-')+'-'+n.slice(0,10)+'.json',JSON.stringify(out));localStorage.setItem('sp:lastbackup:'+id,Date.now());toast('Backup downloaded');settingsRefresh()});
function settingsRefresh(){if(st.tab=='settings')views.settings()}
act.restore=(d,b)=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=()=>busy(b,async()=>{const f=inp.files[0];if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){return toast('That file is not valid JSON')}
  if(j.format!=='stockpilot-backup'||!j.data)return toast('This is not a StockPilot backup file');
  if(j.shop_id!==st.cur.shop_id)return toast('This backup belongs to a different shop');
  if(await sha(JSON.stringify(j.data))!==j.sha256)return toast('The backup file is damaged or was edited. Restore stopped.');
  if(!confirm('Restore missing categories and products from the backup made '+dt(j.exported_at)+'? Existing products are left as they are.'))return;
  const id=st.cur.shop_id,f2=q=>q.eq('shop_id',id),haveC=await fetchAll('categories','id',f2),cmap={};
  for(const c of j.data.categories||[]){let x=haveC.find(h=>h.name.toLowerCase()==c.name.toLowerCase());if(!x)x=await db(sb.from('categories').insert({shop_id:id,name:c.name}).select().single());cmap[c.id]=x.id}
  const haveP=await fetchAll('products','id',f2),skus=new Set(haveP.map(x=>x.sku.toLowerCase()));let np=0;
  for(const p of j.data.products||[]){if(skus.has(p.sku.toLowerCase()))continue;
   const n=await db(sb.from('products').insert({shop_id:id,name:p.name,sku:p.sku,barcode:p.barcode,description:p.description,unit:p.unit,price:p.price,cost:p.cost,reorder_level:p.reorder_level,category_id:cmap[p.category_id]||null}).select().single());
   if(Number(p.stock)>0)await db(sb.rpc('adjust_stock',{p_product:n.id,p_delta:Number(p.stock),p_reason:'opening',p_note:'Restored from backup '+j.exported_at}));
   if(p.active===false)await db(sb.from('products').update({active:false}).eq('id',n.id));np++}
  const have=new Set(qGet().map(x=>x.id));let nq=0;for(const x of j.device_pending_sales||[])if(x.user===st.user.id&&!have.has(x.id)){qAdd(x);nq++}
  qBadge();syncQueue();toast('Restored '+np+' product(s)'+(nq?' and '+nq+' unsynced sale(s)':'')+'. Sales history is kept as it is on the server.')});inp.click()};

const meter=p=>{const l=lvl(p);return`<div class="meter" role="img" aria-label="${l.txt}, ${Math.round(l.pct)} percent of full level"><i class="m-${l.c}" style="width:${l.pct>0?Math.max(l.pct,4):0}%"></i></div>`};

function pmHtml(PB){const g=m=>PB.methods.find(x=>x.method==m)||{received:0,n_received:0,pending:0,n_pending:0},c=g('cash'),t=g('transfer'),u=g('ussd'),p=g('pos');
 const oth=Number(u.received)+Number(p.received),othN=u.n_received+p.n_received,tot=Number(c.received)+Number(t.received)+oth,n=c.n_received+t.n_received+othN,
  pend=Number(c.pending)+Number(t.pending)+Number(u.pending)+Number(p.pending),pn=c.n_pending+t.n_pending+u.n_pending+p.n_pending;
 const row=(ic,l,k,v,sub)=>`<tr><td>${ic} <b>${l}</b>${sub?`<br><small style="color:var(--mt)">${sub}</small>`:''}</td><td>${k}</td><td><b>${fmt(v)}</b><div class="hb"><i style="width:${tot?Math.round(v/tot*100):0}%"></i></div></td></tr>`;
 return`<div class="wrap"><table class="pmt"><tr><th>How they paid</th><th>Sales</th><th>Money received</th></tr>${row('','Cash',c.n_received,c.received)}${row('','Bank transfer',t.n_received,t.received)}${row('','Others',othN,oth,'USSD '+fmt(u.received)+' · POS card '+fmt(p.received))}<tr class="tot"><td><b>TOTAL RECEIVED</b></td><td>${n}</td><td><b>${fmt(tot)}</b></td></tr></table></div>${pend?`<div class="note" style="margin-top:10px"><span><b>Waiting to be checked:</b> ${fmt(pend)} (${pn} sale${pn>1?'s':''}). Not counted until the owner presses “Money received”.</span></div>`:''}`}
