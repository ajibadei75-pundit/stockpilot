function parseCsv(t){t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','||c==';'){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
 if(f!==''||r.length){r.push(f);if(r.some(x=>x.trim()))rows.push(r)}return rows}
const IMPH={name:['name','item','product','item name'],sku:['code','sku'],price:['price','selling price'],cost:['cost','cost price'],stock:['stock','quantity','qty','in stock'],minimum:['minimum','min','reorder','alert level'],unit:['unit','sold by'],category:['category','section']};
act.imp=(d,b)=>{const inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv,text/plain';inp.onchange=()=>busy(b,async()=>{const f=inp.files[0];if(!f)return;const rows=parseCsv(await f.text());if(rows.length<2)return toast('The file is empty');
  const H=rows[0].map(x=>x.trim().toLowerCase()),ix={};for(const k in IMPH)ix[k]=H.findIndex(h=>IMPH[k].includes(h));
  if(ix.name<0||ix.price<0)return toast('The file needs the columns name and price. Download the template to see the format.');
  const g=(r,k)=>ix[k]>=0?String(r[ix[k]]??'').trim():'',data=rows.slice(1,301).map((r,i)=>({name:g(r,'name'),sku:g(r,'sku')||(g(r,'name').replace(/[^A-Za-z0-9]/g,'').slice(0,4).toUpperCase()+'-'+(1000+i)),price:parseFloat(g(r,'price')),cost:parseFloat(g(r,'cost'))||0,stock:parseFloat(g(r,'stock'))||0,min:parseFloat(g(r,'minimum'))||0,unit:g(r,'unit')||'piece',cat:g(r,'category')})).filter(x=>x.name);
  if(!data.length)return toast('No items were found in the file');if(!confirm('Import '+data.length+' item(s)? Items whose code already exists are skipped.'))return;
  const id=st.cur.shop_id,cmap={};(await fetchAll('categories','id',q=>q.eq('shop_id',id))).forEach(c=>cmap[c.name.toLowerCase()]=c.id);const have=new Set((await fetchAll('products','id',q=>q.eq('shop_id',id))).map(p=>p.sku.toLowerCase()));let ok=0,skip=0;const bad=[];
  for(let i=0;i<data.length;i++){const x=data[i];if(i%10==0)toast('Importing '+(i+1)+' of '+data.length+'...');
   if(have.has(x.sku.toLowerCase())){skip++;continue}if(!(x.price>=0)||x.stock<0||x.min<0){bad.push(x.name);continue}
   try{let cid=null;if(x.cat){cid=cmap[x.cat.toLowerCase()];if(!cid){const{data:c,error}=await sb.from('categories').insert({shop_id:id,name:x.cat}).select().single();if(error)throw error;cid=cmap[x.cat.toLowerCase()]=c.id}}
    const{data:p,error}=await sb.from('products').insert({shop_id:id,name:x.name,sku:x.sku,category_id:cid,unit:x.unit,price:x.price,cost:x.cost,reorder_level:x.min}).select('id').single();if(error)throw error;
    if(x.stock>0){const{error:e2}=await sb.rpc('adjust_stock',{p_product:p.id,p_delta:x.stock,p_reason:'opening',p_note:'Imported from file'});if(e2)throw e2}have.add(x.sku.toLowerCase());ok++}catch(e){bad.push(x.name)}}
  toast(ok+' item(s) added'+(skip?', '+skip+' skipped (code already used)':'')+(bad.length?', '+bad.length+' could not be added':'')+'.');views.products()});inp.click()};
